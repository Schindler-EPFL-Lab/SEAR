name: Publish to Pypi

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone vggt (gitignored, vendored into the wheel)
        run: |
          git clone https://github.com/facebookresearch/vggt.git vggt
          git -C vggt checkout 44b3afbd1869d8bde4894dd8ea1e293112dd5eba
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}